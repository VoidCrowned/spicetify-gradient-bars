name: Bug report
description: Something looks or behaves wrong with Gradient Progress Bar, Gradient Connect Bar or Gradient Bars.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Most problems depend on the exact Spotify version, theme and extensions, so please fill in the details below.
  - type: dropdown
    id: extension
    attributes:
      label: Which extension?
      options:
        - Gradient Progress Bar
        - Gradient Connect Bar
        - Gradient Bars
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Theme
      description: The Spicetify theme (and colour scheme) you use, or "none".
      placeholder: Hazy (Custom color on)
    validations:
      required: true
  - type: input
    id: spotify-version
    attributes:
      label: Spotify version
      description: Spotify → Settings → About.
      placeholder: 1.3.6.1921
    validations:
      required: true
  - type: input
    id: spicetify-version
    attributes:
      label: Spicetify version
      description: Output of `spicetify -v`.
      placeholder: 2.46.4
    validations:
      required: true
  - type: textarea
    id: extensions
    attributes:
      label: Other extensions
      description: Other Spicetify extensions you have enabled.
      placeholder: playback-bar-waveform.js
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: If it's visual, paste or drag a screenshot here.
  - type: textarea
    id: report
    attributes:
      label: Self-test or status report
      description: |
        In Spotify's devtools console ([how to open it](https://github.com/VoidCrowned/spicetify-gradient-bars/blob/main/TESTING.md#opening-the-devtools-console)), for the Connect bar ideally while audio plays on another device:
        - if the settings open, run `await __gpb.selfTest()`, `await __gcb.selfTest()` or `await __gb.selfTest()` and paste what it copies to your clipboard;
        - otherwise run `__gpb.status()`, `__gcb.status()` or `__gb.status()` and paste its output.
      render: text
