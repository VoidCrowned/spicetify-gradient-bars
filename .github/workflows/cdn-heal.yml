name: CDN heal

# Every 3 hours (off the hour): if jsDelivr @main still serves another build than main for any
# of the three extensions, purge again and wait for it (.github/scripts/purge-jsdelivr.sh
# --if-stale, GPB #41). Kept apart from purge-jsdelivr.yml because GitHub disables a scheduled
# workflow after 60 days without repository activity (GPB #42); purge-jsdelivr.yml re-enables
# this one on every push and release.

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purge-jsdelivr

jobs:
  heal:
    # Only main is served (@main); a manual run on another branch would compare the wrong builds.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Purge if the CDN is stale
        env:
          REPO: ${{ github.repository }}
        run: bash .github/scripts/purge-jsdelivr.sh --if-stale
